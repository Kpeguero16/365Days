<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>365 Days - Our Journey</title>
  <meta name="description" content="Our first years together in photos and videos, season by season.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <link rel="preload" href="styles/base.css" as="style">
  <!-- The header's two faces, so the title and labels do not swap fonts after
       the first paint. -->
  <link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/effects.css">
  <!-- The wall cannot render until content.json arrives. Fetching it here
       runs it alongside the scripts instead of after them. -->
  <link rel="preload" href="content.json" as="fetch" crossorigin>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button type="button" class="brand">365 Days</button>
      <nav id="timeline" class="months" aria-label="Months"></nav>
      <div class="topbar-side">
        <p class="now"><span id="nowMonth"></span><span id="photoCount"></span></p>
        <button id="musicToggle" type="button" aria-pressed="false">Play music</button>
      </div>
    </header>

    <main id="content" class="content">
      <div id="wall" class="wall"></div>
    </main>
  </div>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="viewer-stage"></div>
    <div class="viewer-bar">
      <p class="viewer-info" aria-live="polite"></p>
      <div class="viewer-controls">
        <button type="button" data-step="-1">&larr; Prev</button>
        <button type="button" data-step="1">Next &rarr;</button>
        <button type="button" class="viewer-close">Close<span class="viewer-esc"> [Esc]</span></button>
      </div>
    </div>
  </div>

  <audio id="bgAudio" src="assets/audio/background.mp3" preload="none"></audio>

  <!-- High priority for the scripts the first render needs; otherwise Chrome
       holds some of them back until the stylesheets finish. -->
  <script src="scripts/content.js" defer fetchpriority="high"></script>
  <script src="scripts/media.js" defer fetchpriority="high"></script>
  <script src="scripts/wall.js" defer fetchpriority="high"></script>
  <script src="scripts/music.js" defer></script>
  <script src="scripts/app.js" defer fetchpriority="high"></script>
  <script src="scripts/easter.js" defer></script>
</body>
</html>
